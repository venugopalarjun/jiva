<style>

  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);background:var(--white);border:0.5px solid var(--clay-tint-border);border-radius:999px;padding:5px 13px;cursor:pointer;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:40px;}
  .card{display:flex;gap:14px;padding:13px 14px;border:0.5px solid var(--clay-tint-border);border-radius:13px;background:var(--white);align-items:center;transition:box-shadow .14s,transform .14s;}

  .thumb{width:60px;height:60px;flex-shrink:0;}
  .body{min-width:0;}
  .tagline{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px;}

<script>
/* ---- category palette: [label, accent, tint] ---- */
const CAT={origin:['Origin','#D85A30','#FAECE7'],tech:['The hard tech','#1D9E75','#E3F2EC'],broke:['What broke','#BA7517','#FAEEDA'],think:['The thinking','#7F77DD','#ECEBFA'],meta:['The meta','#6E6D66','#EEEDEA']};

const G={

 kalash:(A,B)=>`<rect x="34" y="37" width="32" height="5" rx="2" fill="${A}"/><path d="M37 42 H63 L59 48 Q72 54 72 62 A22 12 0 0 1 28 62 Q28 54 41 48 Z" fill="${A}"/><path d="M50 50 l-4 6 5 2 -4 7" stroke="${B}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
 trishula:(A)=>`<path d="M50 40 V74" stroke="${A}" stroke-width="4" stroke-linecap="round"/><path d="M34 46 C34 30 42 24 50 24 C58 24 66 30 66 46" fill="none" stroke="${A}" stroke-width="3.2"/><path d="M34 46 V36 M66 46 V36" stroke="${A}" stroke-width="3.2" stroke-linecap="round"/><path d="M50 26 V16" stroke="${A}" stroke-width="3.2" stroke-linecap="round"/><path d="M50 12 l3.5 6 -3.5 6 -3.5 -6Z" fill="${A}"/><path d="M43 44 H57" stroke="${A}" stroke-width="3" stroke-linecap="round"/>`,
 lotuscoin:(A,B)=>`<g fill="${A}"><path d="M50 68 C41 63 33 57 33 47 C44 49 50 57 50 68Z"/><path d="M50 68 C59 63 67 57 67 47 C56 49 50 57 50 68Z"/></g><circle cx="50" cy="45" r="11" fill="${B}" stroke="${A}" stroke-width="2.6"/><text x="50" y="50.5" text-anchor="middle" font-size="13" font-family="Newsreader,serif" fill="${A}">₹</text>`,
 fourdiyas:(A)=>`<g fill="${A}"><path d="M25 62 Q31 69 37 62Z"/><path d="M39 62 Q45 69 51 62Z"/><path d="M53 62 Q59 69 65 62Z"/><path d="M67 62 Q73 69 79 62Z"/><path d="M31 40 C27 50 29 57 31 57 C33 57 35 50 31 40Z"/><path d="M45 48 C42 55 44 59 45 59 C46 59 48 55 45 48Z"/><path d="M59 48 C56 55 58 59 59 59 C60 59 62 55 59 48Z"/><path d="M73 48 C70 55 72 59 73 59 C74 59 76 55 73 48Z"/></g>`,
 varada:(A,B)=>`<rect x="39" y="46" width="22" height="18" rx="8" fill="${A}"/><g fill="${A}"><rect x="40" y="33" width="4.6" height="16" rx="2.3"/><rect x="46.4" y="30" width="4.6" height="19" rx="2.3"/><rect x="52.8" y="31" width="4.6" height="18" rx="2.3"/><rect x="59.2" y="34" width="4.6" height="15" rx="2.3"/></g><rect x="30" y="49" width="12" height="4.6" rx="2.3" transform="rotate(-38 30 49)" fill="${A}"/><circle cx="50" cy="56" r="4.2" fill="${B}"/>`,
 bow:(A)=>`<path d="M40 26 C60 40 60 60 40 74" fill="none" stroke="${A}" stroke-width="4" stroke-linecap="round"/><path d="M40 26 L40 74" stroke="${A}" stroke-width="2"/><path d="M33 50 H72" stroke="${A}" stroke-width="3" stroke-linecap="round"/><path d="M72 50 l-7 -4 M72 50 l-7 4" stroke="${A}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M33 50 l5 -3 M33 50 l5 3" stroke="${A}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`,
 mala:(A)=>`<circle cx="50" cy="47" r="17" fill="none" stroke="${A}" stroke-width="5" stroke-dasharray="1.5 8" stroke-linecap="round"/><circle cx="50" cy="66" r="4.6" fill="${A}"/><path d="M50 71 V79 M46.5 70.5 l-1.5 7 M53.5 70.5 l1.5 7" stroke="${A}" stroke-width="2" stroke-linecap="round"/>`,
 ghanta:(A,B)=>`<circle cx="50" cy="31" r="5" fill="none" stroke="${A}" stroke-width="3"/><path d="M50 36 v3" stroke="${A}" stroke-width="3"/><path d="M37 45 Q37 39 50 39 Q63 39 63 45 Q66 60 71 67 H29 Q34 60 37 45Z" fill="${A}"/><path d="M31 67 H69" stroke="${B}" stroke-width="2"/><circle cx="50" cy="71" r="3" fill="${A}"/>`,
 paduka:(A,B)=>`<g fill="${A}"><ellipse cx="41" cy="55" rx="7" ry="12"/><ellipse cx="59" cy="55" rx="7" ry="12"/><circle cx="41" cy="39" r="3"/><circle cx="59" cy="39" r="3"/><circle cx="34" cy="45" r="1.6"/><circle cx="47" cy="44" r="1.6"/><circle cx="53" cy="44" r="1.6"/><circle cx="66" cy="45" r="1.6"/></g><circle cx="41" cy="57" r="2.4" fill="${B}"/><circle cx="59" cy="57" r="2.4" fill="${B}"/>`,
 pothi:(A,B)=>`<rect x="26" y="43" width="48" height="15" rx="2.5" fill="${A}"/><path d="M30 47 H70 M30 50.5 H70 M30 54 H70" stroke="${B}" stroke-width="1.3"/><path d="M50 37 V63" stroke="${A}" stroke-width="2.5"/><circle cx="50" cy="35" r="3" fill="${A}"/>`,
 yantra:(A)=>`<rect x="30" y="30" width="40" height="40" fill="none" stroke="${A}" stroke-width="2.4"/><path d="M45 30 h10 M45 70 h10 M30 45 v10 M70 45 v10" stroke="${A}" stroke-width="3.4"/><path d="M50 36 L63 58 H37Z" fill="none" stroke="${A}" stroke-width="2.2"/><path d="M50 64 L37 42 H63Z" fill="none" stroke="${A}" stroke-width="2.2"/><circle cx="50" cy="50" r="2.6" fill="${A}"/>`,

 bahikhata:(A,B)=>`<rect x="33" y="33" width="34" height="42" rx="2.5" fill="${A}"/><rect x="37" y="37" width="30" height="34" rx="1.5" fill="${B}"/><path d="M41 45 H61 M41 51 H61 M41 57 H55" stroke="${A}" stroke-width="1.6" stroke-linecap="round"/><path d="M50 30 V78" stroke="${A}" stroke-width="2" stroke-dasharray="2 3" opacity=".75"/><path d="M33 54 H67" stroke="${A}" stroke-width="2.2" stroke-dasharray="2 3"/><circle cx="50" cy="54" r="2.6" fill="${A}"/>`,
 garuda:(A)=>`<path d="M50 42 Q40 32 26 34 Q34 40 43 44 Q34 46 30 53 Q42 50 50 46 Q58 50 70 53 Q66 46 57 44 Q66 40 74 34 Q60 32 50 42Z" fill="${A}"/><path d="M50 45 v9" stroke="${A}" stroke-width="3" stroke-linecap="round"/><path d="M50 40 l-3.5 5 h7Z" fill="${A}"/><path d="M30 66 q5 -6 10 0 t10 0 t10 0 t10 0" fill="none" stroke="${A}" stroke-width="3" stroke-linecap="round"/><circle cx="72" cy="64" r="2.4" fill="${A}"/>`,
};
function thumb(m,cat){const [,A,B]=CAT[cat];return `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="1.5" y="1.5" width="97" height="97" rx="18" fill="${B}"/>${ring(A)}${G[m](A,B)}</svg>`;}
/* ---- POSTS: newest first. Add a line per post: [title, category, motif, date, readTime, isNew, url] ---- */
const posts=[
 ['The Granola-and-Claude moment that started Jiva','origin','diya','14 September 2026','7 min',true,'/blog/the-granola-and-claude-moment'],
];
const grid=document.getElementById('grid');
grid.innerHTML=posts.map(([t,cat,m,date,read,isNew,url])=>{
 const [label,acc]=CAT[cat];
 return `<a class="card" href="${url}" data-cat="${cat}"><div class="thumb">${thumb(m,cat)}</div><div class="body"><div class="tagline"><span class="dot" style="background:${acc}"></span>${label}</div><div class="ct">${t}</div><div class="cm">${isNew?'<span class="new">NEW · </span>':''}${date} · ${read}</div></div></a>`;
}).join('');
document.getElementById('filter').addEventListener('click',e=>{const chip=e.target.closest('.chip');if(!chip)return;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));chip.classList.add('on');const cat=chip.dataset.cat;let n=0;document.querySelectorAll('.card').forEach(p=>{const show=(cat==='all'||p.dataset.cat===cat);p.style.display=show?'':'none';if(show)n++;});const g=document.getElementById('grid');let e2=document.getElementById('emptymsg');if(!n){if(!e2){e2=document.createElement('div');e2.id='emptymsg';e2.className='empty';e2.textContent='No posts in this category yet — more on the way.';g.after(e2);}}else if(e2){e2.remove();}});
</script>
